<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <div class="checkout-container">
        <h2>Secure Checkout</h2>
        <form id="checkout-form">
            
            <!-- Shipping Address Section -->
            <fieldset>
                <legend>Shipping Address</legend>
                
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe">
                </div>

                <div class="input-group">
                    <label for="address">Street Address</label>
                    <input type="text" id="address" name="address" placeholder="123 Main St">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" placeholder="City">
                    </div>
                    <div class="input-group">
                        <label for="zip">Zip Code</label>
                        <input type="text" id="zip" name="zip" placeholder="12345">
                    </div>
                </div>
            </fieldset>

            <!-- Payment Info Section -->
            <fieldset>
                <legend>Payment Information</legend>
                
                <div class="input-group">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" name="cardNumber" placeholder="xxxx-xxxx-xxxx-xxxx" maxlength="19">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="expDate">Expiry Date</label>
                        <input type="text" id="expDate" name="expDate" placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="input-group">
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4">
                    </div>
                </div>
            </fieldset>

            <!-- Error message container -->
            <div id="error-message" class="error-hidden"></div>

            <!-- Place Order Button -->
            <button type="submit" id="place-order-btn">Place Order</button>
        </form>
    </div>

    <script src="checkout.js"></script>
</body>
</html>
